<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f5f0ea">
    <title>Свадебное приглашение</title>

    <style>
        :root {
            --bg: #f5f0ea;
            --bg-soft: #fbf8f4;
            --card: rgba(255, 255, 255, 0.86);
            --text: #29231f;
            --muted: #756d67;
            --line: rgba(73, 57, 48, 0.14);
            --accent: #8b5e62;
            --accent-dark: #6f4549;
            --danger: #a33c3c;
            --shadow: 0 24px 70px rgba(78, 57, 46, 0.12);
            --radius: 24px;
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        html {
            color-scheme: light;
        }

        body {
            margin: 0;
            min-height: 100svh;
            display: grid;
            place-items: center;
            padding: clamp(1rem, 4vw, 2.5rem);
            overflow-x: hidden;
            color: var(--text);
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background:
                radial-gradient(circle at 18% 18%, rgba(139, 94, 98, 0.10), transparent 28rem),
                radial-gradient(circle at 82% 78%, rgba(174, 145, 111, 0.11), transparent 30rem),
                linear-gradient(160deg, var(--bg-soft), var(--bg));
        }

        body::before,
        body::after {
            content: "";
            position: fixed;
            width: min(32rem, 70vw);
            aspect-ratio: 1;
            border: 1px solid rgba(139, 94, 98, 0.08);
            border-radius: 50%;
            pointer-events: none;
        }

        body::before {
            top: -18rem;
            right: -12rem;
        }

        body::after {
            bottom: -20rem;
            left: -14rem;
        }

        body.intro-lock {
            overflow: hidden;
        }

        /* Intro */
        #intro {
            position: fixed;
            inset: 0;
            z-index: 10;
            display: grid;
            place-items: center;
            padding: 1.5rem;
            background: linear-gradient(160deg, var(--bg-soft), var(--bg));
        }

        #intro[hidden] {
            display: none;
        }

        .intro-phrase {
            position: relative;
            margin: 0;
            text-align: center;
            line-height: 1.05;
            font-family: "Marck Script", "Segoe Script", "Brush Script MT", cursive;
            font-size: clamp(2rem, 8vw, 4.6rem);
            font-weight: 400;
            letter-spacing: 0.01em;
        }

        .intro-phrase__stroke,
        .intro-phrase__fill {
            display: block;
        }

        .intro-phrase__stroke {
            color: transparent;
            -webkit-text-stroke: 1.8px rgba(41, 35, 31, 0.92);
            clip-path: inset(0 100% 0 0);
        }

        .intro-phrase__fill {
            position: absolute;
            inset: 0;
            color: var(--text);
            opacity: 0;
        }

        .intro-phrase__yes {
            color: var(--accent);
        }

        #intro.is-drawing .intro-phrase__stroke {
            animation: draw-text 1.7s linear forwards;
        }

        #intro.is-filled .intro-phrase__fill {
            animation: fill-text 0.32s ease-out forwards;
        }

        #intro.is-leaving {
            animation: intro-out 0.52s ease-in forwards;
        }

        @keyframes draw-text {
            to { clip-path: inset(0 0 0 0); }
        }

        @keyframes fill-text {
            from { opacity: 0; filter: blur(1px); }
            to { opacity: 1; filter: blur(0); }
        }

        @keyframes intro-out {
            to { opacity: 0; transform: translateY(8px); }
        }

        /* Main card */
        #app {
            width: 100%;
            display: grid;
            place-items: center;
            opacity: 0;
            transform: translateY(10px);
            pointer-events: none;
            transition: opacity 0.45s ease, transform 0.45s ease;
        }

        body.intro-done #app {
            opacity: 1;
            transform: none;
            pointer-events: auto;
        }

        .card {
            width: min(100%, 560px);
            padding: clamp(1.4rem, 5vw, 2.7rem);
            border: 1px solid rgba(255, 255, 255, 0.72);
            border-radius: var(--radius);
            background: var(--card);
            box-shadow: var(--shadow);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
        }

        .eyebrow {
            margin: 0 0 0.55rem;
            color: var(--accent);
            font-size: 0.76rem;
            font-weight: 800;
            letter-spacing: 0.16em;
            text-transform: uppercase;
        }

        h1 {
            margin: 0;
            font-family: Georgia, "Times New Roman", serif;
            font-size: clamp(2rem, 6vw, 3rem);
            font-weight: 500;
            line-height: 1.02;
            letter-spacing: -0.025em;
        }

        .lead {
            max-width: 42ch;
            margin: 0.85rem 0 1.8rem;
            color: var(--muted);
            font-size: 1rem;
            line-height: 1.6;
        }

        .fields {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 1rem;
        }

        .field {
            display: grid;
            gap: 0.5rem;
        }

        label {
            font-size: 0.9rem;
            font-weight: 700;
        }

        input {
            width: 100%;
            min-height: 50px;
            padding: 0.8rem 0.95rem;
            border: 1px solid var(--line);
            border-radius: 14px;
            outline: none;
            color: var(--text);
            background: rgba(255, 255, 255, 0.68);
            font: inherit;
            transition: border-color 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
        }

        input::placeholder {
            color: #aaa19b;
        }

        input:hover {
            border-color: rgba(111, 69, 73, 0.28);
        }

        input:focus-visible {
            border-color: var(--accent);
            background: #fff;
            box-shadow: 0 0 0 4px rgba(139, 94, 98, 0.12);
        }

        .error {
            min-height: 1.35rem;
            margin: 0.7rem 0 -0.15rem;
            color: var(--danger);
            font-size: 0.9rem;
            line-height: 1.4;
        }

        .submit-button {
            width: 100%;
            min-height: 52px;
            margin-top: 0.95rem;
            padding: 0.85rem 1.1rem;
            border: 0;
            border-radius: 14px;
            color: #fff;
            background: linear-gradient(135deg, var(--accent), var(--accent-dark));
            box-shadow: 0 10px 24px rgba(111, 69, 73, 0.18);
            font: inherit;
            font-weight: 800;
            cursor: pointer;
            transition: transform 0.12s ease, box-shadow 0.2s ease, filter 0.2s ease;
        }

        .submit-button:hover {
            filter: brightness(1.035);
            box-shadow: 0 14px 30px rgba(111, 69, 73, 0.23);
        }

        .submit-button:active {
            transform: translateY(1px) scale(0.995);
        }

        .submit-button:focus-visible {
            outline: 3px solid rgba(139, 94, 98, 0.24);
            outline-offset: 3px;
        }

        .privacy-note {
            margin: 1rem 0 0;
            color: var(--muted);
            font-size: 0.78rem;
            line-height: 1.45;
            text-align: center;
        }

        @media (max-width: 560px) {
            .fields {
                grid-template-columns: 1fr;
            }

            .card {
                border-radius: 20px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                scroll-behavior: auto !important;
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>

<body class="intro-lock">
    <div id="intro" aria-hidden="true">
        <p class="intro-phrase">
            <span class="intro-phrase__stroke">Она сказала: <span class="intro-phrase__yes">«Да»</span>!</span>
            <span class="intro-phrase__fill">Она сказала: <span class="intro-phrase__yes">«Да»</span>!</span>
        </p>
    </div>

    <div id="app">
        <main class="card">
            <p class="eyebrow">Свадебное приглашение</p>
            <h1>Добро пожаловать</h1>
            <p class="lead">Укажите имя и фамилию — и мы откроем для вас приглашение.</p>

            <form id="guestForm" novalidate>
                <div class="fields">
                    <div class="field">
                        <label for="firstName">Имя</label>
                        <input
                            id="firstName"
                            name="firstName"
                            type="text"
                            autocomplete="given-name"
                            placeholder="Иван"
                            maxlength="80"
                            required
                        >
                    </div>

                    <div class="field">
                        <label for="lastName">Фамилия</label>
                        <input
                            id="lastName"
                            name="lastName"
                            type="text"
                            autocomplete="family-name"
                            placeholder="Иванов"
                            maxlength="80"
                            required
                        >
                    </div>
                </div>

                <div id="formError" class="error" role="alert" aria-live="polite"></div>
                <button class="submit-button" type="submit">Открыть приглашение</button>
            </form>

            <p class="privacy-note">Данные сохраняются только в вашем браузере.</p>
        </main>
    </div>

    <script>
        (() => {
            const INTRO_TIMING = {
                draw: 1700,
                pause: 120,
                fill: 320,
                out: 520
            };

            const intro = document.getElementById('intro');
            const form = document.getElementById('guestForm');
            const firstNameInput = document.getElementById('firstName');
            const lastNameInput = document.getElementById('lastName');
            const errorBox = document.getElementById('formError');

            const finishIntro = () => {
                document.body.classList.remove('intro-lock');
                document.body.classList.add('intro-done');
                intro.hidden = true;
                focusFirstEmptyField();
            };

            const focusFirstEmptyField = () => {
                const target = firstNameInput.value ? lastNameInput : firstNameInput;
                window.setTimeout(() => target.focus(), 50);
            };

            const runIntro = () => {
                if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
                    finishIntro();
                    return;
                }

                const fillAt = INTRO_TIMING.draw + INTRO_TIMING.pause;
                const leaveAt = fillAt + INTRO_TIMING.fill;
                const finishAt = leaveAt + INTRO_TIMING.out + 30;

                requestAnimationFrame(() => intro.classList.add('is-drawing'));
                window.setTimeout(() => intro.classList.add('is-filled'), fillAt);
                window.setTimeout(() => intro.classList.add('is-leaving'), leaveAt);
                window.setTimeout(finishIntro, finishAt);
            };

            const readSavedGuest = () => {
                try {
                    firstNameInput.value = localStorage.getItem('guestFirstName') || '';
                    lastNameInput.value = localStorage.getItem('guestLastName') || '';
                } catch {
                    // localStorage может быть недоступен в приватном режиме или из-за политики браузера.
                }
            };

            const saveGuest = (firstName, lastName) => {
                try {
                    localStorage.setItem('guestFirstName', firstName);
                    localStorage.setItem('guestLastName', lastName);
                } catch {
                    // Сохранение не критично: приглашение всё равно откроется.
                }
            };

            const showError = (message, input) => {
                errorBox.textContent = message;
                input?.focus();
            };

            const normalizeName = (value) => value.replace(/\s+/g, ' ').trim();

            form.addEventListener('submit', (event) => {
                event.preventDefault();
                errorBox.textContent = '';

                const firstName = normalizeName(firstNameInput.value);
                const lastName = normalizeName(lastNameInput.value);

                if (!firstName) {
                    showError('Пожалуйста, укажите имя.', firstNameInput);
                    return;
                }

                if (!lastName) {
                    showError('Пожалуйста, укажите фамилию.', lastNameInput);
                    return;
                }

                firstNameInput.value = firstName;
                lastNameInput.value = lastName;
                saveGuest(firstName, lastName);

                window.location.assign('index_old.html');
            });

            readSavedGuest();
            runIntro();
        })();
    </script>
</body>
</html>
