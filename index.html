<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Свадебное приглашение — выбор версии</title>

    <style>
        :root {
            --bg: #f7f7fb;
            --card: #fff;
            --text: #222;
            --muted: #666;
            --accent: #7c3aed;
            --accent2: #4f46e5;
            --shadow: 0 10px 30px rgba(0,0,0,.08);
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100svh;
            display: grid;
            place-items: center;
            padding: 2rem;
            font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Inter, "Helvetica Neue", Arial, "Noto Sans";
            color: var(--text);
            background: linear-gradient(180deg,#f7f7fb,#ececf7);
        }

        body.intro-lock { overflow: hidden; }

        /* =======================
           Intro (рисование фразы)
           ======================= */

        @property --p {
            syntax: "<number>";
            inherits: false;
            initial-value: 0;
        }

        #intro {
            position: fixed;
            inset: 0;
            display: grid;
            place-items: center;
            padding: 2rem;
            background: linear-gradient(180deg,#f7f7fb,#ececf7);
            z-index: 9999;
        }

        #intro[hidden] { display: none; }

        .intro-inner {
            width: min(980px, 100%);
            display: grid;
            place-items: center;
            text-align: center;
        }

        .intro-phrase {
            position: relative;
            line-height: 1.05;
            padding: 0.25rem 0.5rem;
        }

        .intro-phrase .stroke,
        .intro-phrase .fill {
            display: inline-block;
            font-family: "Marck Script", "Segoe Script", "Brush Script MT", "Comic Sans MS", cursive;
            font-size: clamp(34px, 6.2vw, 74px);
            letter-spacing: .2px;
            white-space: nowrap;
        }

        /* Контур (как будто рисуем ручкой) */
        .intro-phrase .stroke {
            color: transparent;
            -webkit-text-stroke: 2.2px rgba(22, 22, 22, .92);
            text-stroke: 2.2px rgba(22, 22, 22, .92);
            filter: drop-shadow(0 1px 0 rgba(0,0,0,.05));
            --p: 0;
            clip-path: inset(0 calc(100% - (var(--p) * 100%)) 0 0 round 10px);
            opacity: 1;
        }

        /* Заливка (появляется быстро после прорисовки) */
        .intro-phrase .fill {
            position: absolute;
            inset: 0;
            color: rgba(22, 22, 22, .96);
            opacity: 0;
            transform: translateY(0.5px);
        }

        .intro-phrase .yes {
            color: rgba(79, 70, 229, .96);
        }

        #intro.run .stroke {
            animation: draw var(--draw-ms, 4200ms) linear forwards;
        }

        #intro.fill .fill {
            animation: fillIn var(--fill-ms, 360ms) ease-out forwards;
        }

        #intro.out {
            animation: introOut var(--out-ms, 520ms) ease-in forwards;
        }

        @keyframes draw {
            0%   { --p: 0; }
            100% { --p: 1; }
        }

        @keyframes fillIn {
            0%   { opacity: 0; filter: blur(1px); }
            100% { opacity: 1; filter: blur(0); }
        }

        @keyframes introOut {
            to { opacity: 0; transform: translateY(6px); }
        }

        /* =======================
           Основная страница
           ======================= */

        #app {
            width: 100%;
            display: grid;
            place-items: center;
            opacity: 0;
            transform: translateY(6px);
            transition: opacity .45s ease, transform .45s ease;
            pointer-events: none;
        }

        body.intro-done #app {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }

        .card {
            background: var(--card);
            border-radius: 16px;
            box-shadow: var(--shadow);
            width: 100%;
            max-width: 520px;
            padding: 2rem;
        }

        h1 { margin: 0 0 .5rem; font-size: 1.6rem; }

        p { margin: .25rem 0 1rem; color: var(--muted); }

        label { display: block; font-weight: 600; margin-bottom: .5rem; }

        input[type="date"], input[type="text"] {
            width: 100%;
            padding: .75rem 1rem;
            font-size: 1rem;
            border: 1px solid #ddd;
            border-radius: 12px;
            outline: none;
            background: #fafafa;
            transition: .2s border-color, .2s box-shadow;
        }

        input[type="date"]:focus, input[type="text"]:focus {
            border-color: var(--accent2);
            box-shadow: 0 0 0 3px rgba(99,102,241,.16);
        }

        button {
            margin-top: 1rem;
            width: 100%;
            padding: .9rem 1rem;
            font-size: 1rem;
            font-weight: 700;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg,var(--accent),var(--accent2));
            color: #fff;
            cursor: pointer;
            transition: transform .06s, opacity .2s;
        }

        button:hover { opacity: .96; }
        button:active { transform: scale(.99); }

        .error {
            color: #b91c1c;
            font-size: .95rem;
            display: none;
            margin-top: .5rem;
        }

        .footer {
            margin-top: 1rem;
            font-size: .9rem;
            color: var(--muted);
            text-align: center;
        }

        .modal {
            position: fixed;
            inset: 0;
            display: none;
            place-items: center;
            padding: 1rem;
            background: rgba(0,0,0,.4);
            z-index: 10000;
        }

        .modal.open { display: grid; }

        .modal-box {
            background: #fff;
            border-radius: 16px;
            box-shadow: var(--shadow);
            max-width: 460px;
            width: 100%;
            padding: 1.25rem;
        }

        .modal h2 { margin: .25rem 0 .5rem; font-size: 1.25rem; }
        .modal p { margin: 0 0 .75rem; }
        .modal .row { display: flex; gap: .75rem; }

        .notice {
            margin-top: 1rem;
            padding: .75rem 1rem;
            background: #fff7ed;
            border: 1px dashed #fb923c;
            border-radius: 12px;
        }
        .notice-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
        }
        .notice-text {
            font-size: .95rem;
            line-height: 1.35;
        }
        .notice input[type="checkbox"] {
            width: 22px;
            height: 22px;
            accent-color: #ea580c;
            cursor: pointer;
        }

        @media (max-width: 520px) {
            body { padding: 1.25rem; }
            .card { padding: 1.35rem; border-radius: 14px; }
            .modal .row { flex-direction: column; }
            .modal .row button { margin-top: .65rem; }
        }

        @media (prefers-reduced-motion: reduce) {
            #intro { animation: none !important; }
            #intro.run .stroke { animation: none !important; }
            #intro.fill .fill { animation: none !important; opacity: 1 !important; }
            #app { transition: none !important; }
        }
    </style>
</head>

<body class="intro-lock">
    <!-- Intro-экран: сначала "пишем" фразу, потом показываем страницу -->
    <div id="intro" aria-hidden="true">
        <div class="intro-inner">
            <div class="intro-phrase" aria-label='Она сказала: "Да"!'>
                <span class="stroke">Она сказала: <span class="yes">"Да"</span>!</span>
                <span class="fill">Она сказала: <span class="yes">"Да"</span>!</span>
            </div>
        </div>
    </div>

    <!-- Основной контент -->
    <div id="app">
        <main class="card" role="main">
            <h1>Приглашение на свадьбу</h1>
            <p>Пожалуйста, укажите дату своего рождения, чтобы открыть подходящую версию сайта.</p>

            <form id="ageForm" novalidate>
                <label for="lastName">Фамилия</label>
                <input type="text" id="lastName" name="lastName" autocomplete="family-name" required />

                <label for="firstName">Имя</label>
                <input type="text" id="firstName" name="firstName" autocomplete="given-name" required />

                <label for="dob">Дата рождения</label>
                <input type="date" id="dob" name="dob" required />

                <div id="err" class="error" role="alert"></div>
                <button type="submit">Продолжить</button>
            </form>

            <div class="notice" role="note" aria-label="Важная пометка">
                <div class="notice-row">
                    <div class="notice-text"><strong>ВНИМАНИЕ!!!</strong> Если вы — папа одного из молодожёнов, поставьте галочку напротив</div>
                    <input type="checkbox" id="isDad" aria-label="Я папа одного из молодожёнов" />
                </div>
            </div>
        </main>
    </div>

    <!-- Модалка на случай, если пользователю ровно 30 лет -->
    <div id="tieModal" class="modal" aria-hidden="true" aria-labelledby="tieTitle" role="dialog">
        <div class="modal-box">
            <h2 id="tieTitle">Вам ровно 30 лет 🎉</h2>
            <p>Выберите, какую версию сайта открыть:</p>
            <div class="row">
                <button id="goYoung" type="button">Молодёжная</button>
                <button id="goOld" type="button">Классическая</button>
            </div>
        </div>
    </div>

    <script>
        // ===== Intro-анимация =====
        (function () {
            const intro = document.getElementById('intro');

            const DRAW_MS  = 1700;  // дольше "вырисовка"
            const PAUSE_MS = 120;   // минимальная пауза
            const FILL_MS  = 320;   // быстрая "закраска"
            const OUT_MS   = 520;   // плавное исчезновение

            const prefersReduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

            function finishIntro() {
                document.body.classList.remove('intro-lock');
                document.body.classList.add('intro-done');
                intro.hidden = true;
                window.dispatchEvent(new Event('intro:done'));
            }

            if (prefersReduced) { finishIntro(); return; }

            // Применяем тайминги через CSS-переменные
            intro.style.setProperty('--draw-ms', DRAW_MS + 'ms');
            intro.style.setProperty('--fill-ms', FILL_MS + 'ms');
            intro.style.setProperty('--out-ms', OUT_MS + 'ms');

            // Старт
            requestAnimationFrame(() => intro.classList.add('run'));

            // Запуск заливки
            setTimeout(() => intro.classList.add('fill'), DRAW_MS + PAUSE_MS);

            // Уход интро
            setTimeout(() => intro.classList.add('out'), DRAW_MS + PAUSE_MS + FILL_MS);

            // Показ основной страницы
            setTimeout(finishIntro, DRAW_MS + PAUSE_MS + FILL_MS + OUT_MS + 30);
        })();
    </script>

    <script>
        (function () {
            const dobEl = document.getElementById('dob');
            const firstNameEl = document.getElementById('firstName');
            const lastNameEl  = document.getElementById('lastName');
            const form = document.getElementById('ageForm');
            const err = document.getElementById('err');
            const modal = document.getElementById('tieModal');
            const goYoung = document.getElementById('goYoung');
            const goOld = document.getElementById('goOld');
            const isDad = document.getElementById('isDad');
            const dadUrl = 'https://avatars.mds.yandex.net/i?id=030eef689d9b10561d93210bae98da4923f6e616-10879920-images-thumbs&n=13';

            // Установим допустимый диапазон дат
            function todayYMD() {
                const now = new Date();
                const y = now.getFullYear();
                const m = String(now.getMonth() + 1).padStart(2, '0');
                const d = String(now.getDate()).padStart(2, '0');
                return `${y}-${m}-${d}`;
            }
            dobEl.max = todayYMD();
            dobEl.min = '1900-01-01';

            // Prefill
            try {
                const savedFirst = localStorage.getItem('guestFirstName');
                const savedLast  = localStorage.getItem('guestLastName');
                if (savedFirst) firstNameEl.value = savedFirst;
                if (savedLast)  lastNameEl.value  = savedLast;
            } catch (e) {}

            // Фокусируем поля только после интро (чтобы не открывалась клавиатура под заставкой)
            function focusInitial() {
                setTimeout(() => (firstNameEl.value ? dobEl.focus() : lastNameEl.focus()), 50);
            }
            if (document.body.classList.contains('intro-done')) {
                focusInitial();
            } else {
                window.addEventListener('intro:done', focusInitial, { once: true });
            }

            function parseDate(ymd) {
                // Разбираем YYYY-MM-DD в локальный объект Date (без смещения часового пояса)
                const [y, m, d] = ymd.split('-').map(Number);
                return new Date(y, (m || 1) - 1, d || 1);
            }

            function calcAge(birth) {
                const now = new Date();
                let age = now.getFullYear() - birth.getFullYear();
                const mon = now.getMonth() - birth.getMonth();
                if (mon < 0 || (mon === 0 && now.getDate() < birth.getDate())) age--;
                return age;
            }

            function showError(message) {
                err.textContent = message; err.style.display = 'block';
            }
            function clearError() {
                err.textContent = ''; err.style.display = 'none';
            }

            form.addEventListener('submit', function (e) {
                e.preventDefault();
                clearError();
                const f = (firstNameEl.value || '').trim();
                const l = (lastNameEl.value || '').trim();
                if (!l) { showError('Пожалуйста, укажите фамилию.'); lastNameEl.focus(); return; }
                if (!f) { showError('Пожалуйста, укажите имя.'); firstNameEl.focus(); return; }
                try { localStorage.setItem('guestFirstName', f); localStorage.setItem('guestLastName', l); } catch (e) {}

                const value = dobEl.value.trim();
                if (!value) { showError('Пожалуйста, введите дату.'); dobEl.focus(); return; }
                if (!/^\d{4}-\d{2}-\d{2}$/.test(value)) { showError('Неверный формат. Используйте ГГГГ-ММ-ДД.'); return; }

                const birth = parseDate(value);
                if (Number.isNaN(birth.getTime())) { showError('Не удалось распознать дату.'); return; }
                const today = new Date();
                if (birth > today) { showError('Дата рождения не может быть в будущем.'); return; }
                if (birth.getFullYear() < 1900) { showError('Пожалуйста, укажите реальную дату (не ранее 1900 года).'); return; }

                const age = calcAge(birth);
                if (isDad && isDad.checked) { window.location.href = dadUrl; return; }

                if (age > 30) {
                    window.location.href = 'index_old.html';
                } else if (age < 30) {
                    window.location.href = 'index_yng.html';
                } else {
                    // Ровно 30 — даём выбрать
                    modal.classList.add('open');
                    modal.setAttribute('aria-hidden', 'false');
                }
            });

            // Закрытие модалки по клику снаружи
            modal.addEventListener('click', (e) => {
                if (e.target === modal) {
                    modal.classList.remove('open');
                    modal.setAttribute('aria-hidden', 'true');
                }
            });

            // Кнопки выбора
            goYoung.addEventListener('click', () => {
                if (isDad && isDad.checked) { window.location.href = dadUrl; }
                else { window.location.href = 'index_yng.html'; }
            });
            goOld.addEventListener('click', () => {
                if (isDad && isDad.checked) { window.location.href = dadUrl; }
                else { window.location.href = 'index_old.html'; }
            });
        })();
    </script>
</body>
</html>
